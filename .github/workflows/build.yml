# SPDX-License-Identifier: GPL-3.0-or-later
# Compila y prueba MaxPack en Linux y Windows, y compila maxpack.elf para la PS5.
name: build

on:
  push:
    branches: [main, "fase*"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cmake -B build
      - run: cmake --build build --config Release -j 4
      - run: ctest --test-dir build -C Release --output-on-failure

  ps5:
    runs-on: ubuntu-24.04
    env:
      PS5_SDK_VERSION: v0.45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: SDK de payloads de PS5
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          curl -fsSL -o sdk.zip "https://github.com/ps5-payload-dev/sdk/releases/download/${PS5_SDK_VERSION}/ps5-payload-sdk.zip"
          sudo unzip -q sdk.zip -d /opt
          ls /opt/ps5-payload-sdk/bin /opt/ps5-payload-sdk/toolchain
      - run: /opt/ps5-payload-sdk/bin/prospero-cmake -B build-ps5 -DMAXPACK_PS5=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ps5 -j 4
      - run: llvm-readelf-18 --dyn-syms build-ps5/maxpack.elf | grep -E "sceNotificationSend"
      - uses: actions/upload-artifact@v4
        with:
          name: maxpack-ps5
          path: build-ps5/maxpack.elf
