# SPDX-License-Identifier: GPL-3.0-or-later
# Builds and tests MaxPack on Linux and Windows and packages the PC window (Wails) for Windows,
# Linux and macOS, each on a machine of its own system. With a vX.Y.Z tag it also creates a
# draft release on GitHub with the packages and SHA256SUMS (published by hand).
name: build

on:
  push:
    branches: [main, "fase*", "interfaz-*", "consola-*", "motor-*", "publicacion*"]
    tags: ["v*"]
    # tags always build; branch pushes skip docs-only changes
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

# a newer push to a branch cancels the run in progress; tag runs are never cancelled
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure

  # Windows and macOS only on main, on tags and by hand (to save CI minutes)
  windows:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cmake -B build
      - run: cmake --build build --config Release -j 4
      - run: ctest --test-dir build -C Release --output-on-failure

  # The PC window: the engine (CMake, Release) next to it as maxpack-core, the Go tests
  # with that engine and the test images, and each system's packages. Each system uses its
  # webview (WebView2, WebKitGTK, WebKit) and its C compiler (cgo).
  gui:
    strategy:
      fail-fast: false
      matrix:
        # Linux always; Windows and macOS only on main, on tags and by hand. Only format()'s first
        # argument escapes braces as {{ }}: the inserted text is used as it is, with single braces.
        include: ${{ fromJSON(format('[{{"name":"linux-x64","runner":"ubuntu-24.04"}}{0}]', (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && ',{"name":"windows-x64","runner":"windows-2025"},{"name":"macos-apple-silicon","runner":"macos-15"},{"name":"macos-intel","runner":"macos-15-intel"}' || '')) }}
    name: gui ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      # the oldest macOS that Go supports
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum

      - name: WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev desktop-file-utils

      # the tag without the "v" (v1.2.3 -> 1.2.3), or "dev-" and the commit; NUMBERS is the X.Y.Z part
      - name: Version
        run: |
          bash tools/version.sh "${GITHUB_REF_TYPE}" "${GITHUB_REF_NAME}" "${GITHUB_SHA}" >> "${GITHUB_ENV}"
          cat "${GITHUB_ENV}" | grep -E '^(VERSION|NUMBERS)='

      # a version tag has to be the engine's version, the one in CMakeLists.txt
      - name: The tag is the engine's version
        if: github.ref_type == 'tag'
        run: |
          engine=$(grep -m1 -oE 'maxpack VERSION [0-9]+[.][0-9]+[.][0-9]+' CMakeLists.txt | cut -d' ' -f3)
          test "${NUMBERS}" = "${engine}" || { echo "the tag says ${VERSION} and the engine ${engine}" >&2; exit 1; }
          test "${VERSION}" = "${NUMBERS}" || echo "(pre-release ${VERSION} of engine ${engine})"

      - name: Engine
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cmake -B build
            cmake --build build --config Release -j 4 --target maxpack
            core="${GITHUB_WORKSPACE}/build/Release/maxpack.exe"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j 4 --target maxpack
            core="${GITHUB_WORKSPACE}/build/maxpack"
          fi
          echo "MAXPACK_CORE=${core}" >> "${GITHUB_ENV}"
          "${core}" --version

      - name: Test images
        run: |
          python -I tests/tools/make_exfat.py --out build/fixtures
          echo "MP_FIXTURES=${GITHUB_WORKSPACE}/build/fixtures" >> "${GITHUB_ENV}"

      # the icon, the manifest and the version of the Windows program
      - name: Windows resources
        if: runner.os == 'Windows'
        working-directory: gui
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in build/winres/winres.json --arch amd64 \
            --file-version "${NUMBERS}.0" --product-version "${VERSION}"

      # every language of the window has every text of en.js (node is on the runner)
      - name: Texts of the window
        if: runner.os == 'Linux'
        run: node tools/check_i18n.js

      # without -H windowsgui: the window hides its console (HideConsole) and, when forwarding to maxpack-core,
      # keeps the command line's input and output
      - name: Window
        working-directory: gui
        env:
          CGO_ENABLED: "1"
        run: |
          tags="desktop,production"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # Wails's file dialogs use UTType, a framework that Wails does not link by itself
            export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            tags="${tags},webkit2_41"
          fi
          exe="maxpack"
          core="maxpack-core"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            exe="MaxPack.exe"
            core="maxpack-core.exe"
          fi
          go vet -tags "${tags}" ./...
          go test -tags "${tags}" ./...
          go build -tags "${tags}" -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "out/${exe}" .
          # the engine, next to the window
          cp "${MAXPACK_CORE}" "out/${core}"
          ls -l out
          "./out/${exe}" --version

      - name: Windows package
        if: runner.os == 'Windows'
        working-directory: gui
        run: |
          mkdir -p ../dist
          # the portable zip: the window, the engine and the settings folder, where it keeps everything of its own
          mkdir -p out/portable/MaxPack/settings
          cp out/MaxPack.exe out/maxpack-core.exe ../LICENSE out/portable/MaxPack/
          cp ../THIRD_PARTY_NOTICES out/portable/MaxPack/THIRD_PARTY_NOTICES.txt
          printf '%s\r\n' "MaxPack keeps its settings, the window's size and position and its page's data here." "If you delete this folder, MaxPack keeps its own in your user folder." > out/portable/MaxPack/settings/README.txt
          pwsh -NoProfile -Command "Compress-Archive -Path out/portable/MaxPack -DestinationPath ../dist/maxpack-${{ matrix.name }}-portable.zip"
          ls -l ../dist

      # the installer (NSIS)
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: gui
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          $numbers = "$($env:NUMBERS).0"
          $dist = (Resolve-Path ../dist).Path
          & $makensis /V2 "/DVERSION=$env:VERSION" "/DNUMBERS=$numbers" `
            "/DPROGRAM=$((Resolve-Path out/MaxPack.exe).Path)" "/DCORE=$((Resolve-Path out/maxpack-core.exe).Path)" `
            "/DLICENSE=$((Resolve-Path ../LICENSE).Path)" "/DNOTICES=$((Resolve-Path ../THIRD_PARTY_NOTICES).Path)" "/DICON=$((Resolve-Path build/appicon.ico).Path)" `
            "/DOUTFILE=$dist\maxpack-${{ matrix.name }}-setup.exe" `
            build/windows/installer/maxpack.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Get-ChildItem $dist

      # the installer puts MaxPack in the given folder and in "Installed apps", the window
      # forwards to the engine and compresses an image, and the uninstaller removes everything; all silently
      - name: Test the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP "MaxPackProbe"
          $setup = Get-Item dist/maxpack-${{ matrix.name }}-setup.exe
          Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$folder" -Wait
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MaxPack"
          foreach ($file in "MaxPack.exe", "maxpack-core.exe", "LICENSE.txt", "THIRD_PARTY_NOTICES.txt", "uninstall.exe") {
            if (-not (Test-Path "$folder\$file")) { throw "missing $file" }
          }
          if ((Get-ItemProperty $key).InstallLocation -ne $folder) { throw "does not appear in Installed apps" }
          & "$folder\MaxPack.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "--version" }
          $out = Join-Path $env:RUNNER_TEMP "probe.p5z"
          & "$folder\MaxPack.exe" pack "$env:MP_FIXTURES\basic.exfat" -o $out --p5z
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw "pack" }
          Start-Process -FilePath "$folder\uninstall.exe" -ArgumentList "/S", "_?=$folder" -Wait
          if (Test-Path "$folder\MaxPack.exe") { throw "was not uninstalled" }
          if (Test-Path $key) { throw "is still in Installed apps" }

      - name: macOS package
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          bash gui/build/macos/macos_app.sh gui/out/maxpack gui/out/maxpack-core "${VERSION}" gui/out gui/build/appicon.png
          cp LICENSE THIRD_PARTY_NOTICES gui/out/
          tar -czf "dist/maxpack-${{ matrix.name }}.tar.gz" -C gui/out MaxPack.app LICENSE THIRD_PARTY_NOTICES
          # the disk image for dragging MaxPack to Applications, without any script
          stage="$(mktemp -d)"
          ditto gui/out/MaxPack.app "${stage}/MaxPack.app"
          ln -s /Applications "${stage}/Applications"
          cp LICENSE THIRD_PARTY_NOTICES "${stage}/"
          hdiutil create -volname MaxPack -srcfolder "${stage}" -ov -format UDZO "dist/maxpack-${{ matrix.name }}.dmg"
          ls -l dist

      # the disk image opens with MaxPack.app and the link to Applications; the app copied from it, as
      # Finder does when dragging it, keeps its signature, forwards to the engine and compresses an image
      - name: Test the macOS disk image
        if: runner.os == 'macOS'
        run: |
          image="dist/maxpack-${{ matrix.name }}.dmg"
          hdiutil verify "${image}"
          mount=$(mktemp -d)
          hdiutil attach "${image}" -nobrowse -readonly -mountpoint "${mount}"
          trap 'hdiutil detach "${mount}" || hdiutil detach -force "${mount}"' EXIT
          ls -la "${mount}"
          test "$(ls "${mount}" | paste -sd " " -)" = "Applications LICENSE MaxPack.app THIRD_PARTY_NOTICES"
          apps=$(mktemp -d)
          ditto "${mount}/MaxPack.app" "${apps}/MaxPack.app"
          codesign --verify "${apps}/MaxPack.app"
          "${apps}/MaxPack.app/Contents/MacOS/maxpack" --version
          "${apps}/MaxPack.app/Contents/MacOS/maxpack" pack "${MP_FIXTURES}/basic.exfat" -o "${apps}/probe.p5z" --p5z
          test -s "${apps}/probe.p5z"
          rm -rf "${apps}/MaxPack.app"

      - name: Linux package
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist gui/out/MaxPack
          cp gui/out/maxpack gui/out/maxpack-core gui/build/linux/maxpack.desktop gui/build/linux/maxpack.png gui/build/linux/install.sh LICENSE THIRD_PARTY_NOTICES gui/out/MaxPack/
          chmod 755 gui/out/MaxPack/maxpack gui/out/MaxPack/maxpack-core gui/out/MaxPack/install.sh
          tar -czf "dist/maxpack-${{ matrix.name }}.tar.gz" -C gui/out MaxPack
          ls -l dist

      # install.sh puts the window, the engine, the icon and the menu entry in place, and removes them
      - name: Test the install on Linux
        if: runner.os == 'Linux'
        run: |
          desktop-file-validate gui/build/linux/maxpack.desktop
          home=$(mktemp -d)
          HOME="$home" sh gui/out/MaxPack/install.sh
          test -x "$home/.local/lib/maxpack/maxpack"
          test -x "$home/.local/lib/maxpack/maxpack-core"
          test -f "$home/.local/share/icons/hicolor/256x256/apps/maxpack.png"
          desktop-file-validate "$home/.local/share/applications/maxpack.desktop"
          grep -q "^Exec=$home/.local/lib/maxpack/maxpack %F$" "$home/.local/share/applications/maxpack.desktop"
          "$home/.local/bin/maxpack" --version
          "$home/.local/bin/maxpack" pack "${MP_FIXTURES}/basic.exfat" -o "$home/probe.p5z" --p5z
          test -s "$home/probe.p5z"
          HOME="$home" sh gui/out/MaxPack/install.sh --uninstall
          test ! -e "$home/.local/bin/maxpack"
          test ! -e "$home/.local/lib/maxpack"
          test ! -e "$home/.local/share/applications/maxpack.desktop"

      # the packages keep the files' permissions, which artifacts lose
      - uses: actions/upload-artifact@v4
        with:
          name: maxpack-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # With a v* tag: all the packages (from the jobs above) and their SHA256SUMS in a draft
  # release, which is reviewed and published by hand on GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, gui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # for the build attestation (Sigstore through GitHub's OIDC token)
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: maxpack-*
          merge-multiple: true
      - name: Packages and sums
        run: |
          ls -l artifacts
          # the five packages of each version; if one is missing, there is no release
          for f in maxpack-windows-x64-setup.exe maxpack-windows-x64-portable.zip maxpack-macos-apple-silicon.dmg maxpack-macos-apple-silicon.tar.gz maxpack-macos-intel.dmg maxpack-macos-intel.tar.gz maxpack-linux-x64.tar.gz; do
            test -s "artifacts/${f}" || { echo "missing ${f}" >&2; exit 1; }
          done
          cd artifacts
          sha256sum maxpack-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      # A signed statement, kept by GitHub, that each file was built by this workflow from this
      # commit: `gh attestation verify <file> -R DeLFuS77/maxpack` checks one.
      - name: Build attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/maxpack-*
            artifacts/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --generate-notes --verify-tag --title "MaxPack ${GITHUB_REF_NAME#v}" artifacts/maxpack-* artifacts/SHA256SUMS
