<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- The page of MaxPack, as the one of NXPress: the sections on the left, the list of games in
     the middle with the progress under it, and the options of the section on the right. Every
     text comes from i18n/ (data-t), and the data of the games is written by app.js as text. -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'">
<title>MaxPack</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <nav data-t-label="sections">
    <span class="nav-hl" id="nav-hl" aria-hidden="true"></span>
    <div class="group" data-t="groupSpace"></div>
    <button data-section="compress" class="tone-space"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v6m0 0-3-3m3 3 3-3M12 21v-6m0 0-3 3m3-3 3 3M5 12h14"/></svg></span><span><b data-t="compress"></b><small data-t="hintCompress"></small></span></button>
    <button data-section="decompress" class="tone-space"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9V3m0 0-3 3m3-3 3 3M12 15v6m0 0-3-3m3 3 3-3M5 12h14"/></svg></span><span><b data-t="decompress"></b><small data-t="hintDecompress"></small></span></button>
    <div class="group" data-t="groupCheck"></div>
    <button data-section="verify" class="tone-check"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v6c0 4.3 3.2 7.7 7.5 9 4.3-1.3 7.5-4.7 7.5-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span><span><b data-t="verify"></b><small data-t="hintVerify"></small></span></button>
    <button data-section="details" class="tone-check"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></span><span><b data-t="details"></b><small data-t="hintDetails"></small></span></button>
    <button data-section="rename" class="tone-check"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></span><span><b data-t="rename"></b><small data-t="hintRename"></small></span></button>
    <div class="side-foot">
      <button data-section="settings" class="tone-neutral side-item"><span class="tile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></span><span><b data-t="settings"></b></span></button>
      <div class="side-core" id="side-core"></div>
    </div>
  </nav>

  <section id="work">
    <div class="page-head">
      <h1 class="title-row"><span class="tile" id="title-tile" aria-hidden="true"></span><span id="title"></span></h1>
      <p id="about" class="muted"></p>
    </div>

    <div id="banner" class="banner bad" role="alert" hidden><span id="banner-text"></span></div>

    <div class="toolbar" id="toolbar">
      <button id="add-files" data-t="addFiles"></button>
      <button id="add-folder" data-t="addFolder"></button>
      <button id="clear" class="quiet" data-t="clear"></button>
    </div>

    <div id="drop">
      <div id="empty">
        <span class="empty-art" aria-hidden="true"><svg class="empty-icon" viewBox="0 0 48 48"><path d="M12 30v8h24v-8M24 8v22M16 22l8 8 8-8"/></svg></span>
        <div class="big" data-t="dropHere"></div>
        <div class="muted" data-t="orChoose"></div>
        <div class="empty-buttons">
          <button id="empty-files" class="outline" data-t="addFiles"></button>
          <button id="empty-folder" data-t="addFolder"></button>
        </div>
        <div class="types" id="takes"></div>
      </div>
      <table id="files" hidden>
        <thead><tr><th data-t="game"></th><th class="size" data-t="size"></th><th class="state" data-t="state"></th><th class="remove"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="actions">
      <div class="summary">
        <div id="summary-text"></div>
        <div class="bar total" id="total-bar" hidden><div></div></div>
        <div id="status" class="muted" aria-live="polite"></div>
      </div>
      <button id="pause" class="secondary" hidden></button>
      <button id="cancel" class="secondary" data-t="cancel" hidden></button>
      <button id="start" class="primary big"></button>
    </div>
  </section>

  <aside id="options">
    <section class="block" data-for="compress">
      <h2 id="made-for-name" data-t="madeFor"></h2>
      <div role="radiogroup" aria-labelledby="made-for-name">
        <label class="choice"><input type="radio" name="made-for" value="p5z" checked>
          <span><b data-t="forInstaller"></b><small data-t="forInstallerHint"></small></span></label>
        <label class="choice"><input type="radio" name="made-for" value="folder">
          <span><b data-t="forUsb"></b><small data-t="forUsbHint"></small></span></label>
      </div>
    </section>

    <section class="block" data-for="compress">
      <div class="level-head"><span id="level-name" data-t="level"></span><b id="level-value"></b></div>
      <input id="level" type="range" min="1" max="22" value="19" aria-labelledby="level-name">
      <div class="ends muted"><span data-t="faster"></span><span data-t="smaller"></span></div>
      <div class="segmented levels" role="group" aria-labelledby="level-name"><button data-level="3"><span data-t="light"></span><small>1–6</small></button><button data-level="12"><span data-t="medium"></span><small>7–14</small></button><button data-level="19"><span data-t="maximum"></span><small>15–22</small></button></div>
      <p class="hint" id="level-hint"></p>
      <button id="compare-levels" class="link" data-t="compareLevels"></button>
      <p class="hint" data-t="compareHint"></p>
    </section>

    <section class="block" data-for="decompress">
      <h2 id="unpack-to-name" data-t="unpackTo"></h2>
      <div role="radiogroup" aria-labelledby="unpack-to-name">
        <label class="choice"><input type="radio" name="unpack-to" value="original" checked>
          <span><b data-t="toOriginal"></b><small data-t="toOriginalHint"></small></span></label>
        <label class="choice"><input type="radio" name="unpack-to" value="console">
          <span><b data-t="toConsole"></b><small data-t="toConsoleHint"></small></span></label>
      </div>
    </section>

    <section class="block" data-for="compress decompress">
      <div class="label" data-t="dest"></div>
      <div class="path"><span id="dest"></span><button id="choose-dest" data-t="choose"></button></div>
      <p class="hint" id="dest-hint"></p>
    </section>

    <section class="block" data-for="compress">
      <label class="check top"><input id="delete-originals" type="checkbox"><span data-t="deleteOriginals"></span></label>
      <p class="hint" id="delete-hint"></p>
    </section>

    <!-- the repair data of each .p5z: a PAR2 set next to it, off until it is ticked -->
    <section class="block" data-for="compress decompress">
      <label class="check top"><input id="repair-data" type="checkbox"><span data-t="repairData"></span></label>
      <div class="segmented" id="repair-percent" role="radiogroup" data-t-label="repairPercentName"></div>
      <p class="hint" id="repair-hint"></p>
    </section>

    <section class="block" data-for="compress">
      <div class="label">ampr-emu-ng</div>
      <div class="runtime" id="runtime-state"></div>
      <button id="choose-runtime" class="link" data-t="runtimeChoose"></button>
      <p class="hint" data-t="runtimeHint"></p>
    </section>

    <section class="block" data-for="verify">
      <h2 data-t="verify"></h2>
      <p class="hint" data-t="verifyHint"></p>
    </section>

    <section class="block" data-for="verify">
      <h2 data-t="factRepair"></h2>
      <div class="segmented" id="verify-percent" role="radiogroup" data-t-label="repairPercentName"></div>
      <button id="add-repair" class="link" data-t="addRepair"></button>
      <p class="hint" data-t="addRepairHint"></p>
      <button id="repair-damaged" class="link" data-t="repairDamaged"></button>
      <p class="hint" data-t="repairDamagedHint"></p>
      <p class="warning" id="verify-repair-why" hidden></p>
    </section>

    <section class="block" data-for="rename">
      <h2 data-t="prefNames"></h2>
      <div class="template-in-use" id="rename-template"></div>
      <p class="hint" data-t="renameHint"></p>
      <button id="rename-settings" class="link" data-t="renameChange"></button>
    </section>
  </aside>

  <section id="settings" hidden>
    <div class="page-head"><h1 class="title-row"><span class="tile tone-neutral" id="settings-tile" aria-hidden="true"></span><span data-t="settings"></span></h1></div>
    <div class="pref-page">
      <section class="pref-group">
        <h2 data-t="prefLook"></h2>
        <div class="pref-item stack">
          <div class="pref-text"><b id="language-name" data-t="language"></b></div>
          <div class="segmented" id="languages" role="radiogroup" aria-labelledby="language-name"></div>
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="theme-name" data-t="theme"></b></div>
          <div class="segmented" role="radiogroup" aria-labelledby="theme-name"><button role="radio" data-theme="system" data-t="themeSystem"></button><button role="radio" data-theme="light" data-t="themeLight"></button><button role="radio" data-theme="dark" data-t="themeDark"></button></div>
        </div>
      </section>
      <section class="pref-group">
        <h2>ampr-emu-ng</h2>
        <div class="pref-item">
          <div class="pref-text"><b data-t="runtimeTitle"></b><small data-t="runtimeHint"></small><small class="pref-path" id="pref-runtime"></small></div>
          <div class="pref-buttons"><button id="pref-runtime-choose"></button><button id="pref-runtime-clear" class="quiet"></button></div>
        </div>
      </section>
      <section class="pref-group">
        <h2 data-t="prefWork"></h2>
        <div class="pref-item">
          <div class="pref-text"><b id="low-name" data-t="lowPriority"></b><small data-t="lowPriorityHint"></small></div>
          <input id="pref-low" class="switch" type="checkbox" role="switch" aria-labelledby="low-name">
        </div>
        <div class="pref-item">
          <div class="pref-text"><b data-t="prefPasscode"></b><small data-t="prefPasscodeHint"></small><small class="pref-status warning" id="passcode-bad" data-t="passcodeBad" hidden></small></div>
          <input id="pref-passcode" class="passcode" type="text" spellcheck="false" autocomplete="off" maxlength="32" data-t-placeholder="passcodeDefault">
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="leftovers-name" data-t="prefLeftovers"></b><small data-t="prefLeftoversHint"></small></div>
          <input id="pref-leftovers" class="switch" type="checkbox" role="switch" aria-labelledby="leftovers-name">
        </div>
        <div class="pref-item">
          <div class="pref-text"><b data-t="threadsTitle"></b><small class="pref-path" id="pref-threads"></small><small data-t="measureHint"></small></div>
          <div class="pref-buttons"><button id="pref-measure" data-t="measurePc"></button><button id="pref-threads-all" class="quiet" data-t="threadsUseAll"></button></div>
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="repair-name" data-t="prefRepair"></b><small data-t="prefRepairHint"></small><small class="pref-status" id="pref-repair-why"></small></div>
          <div class="pref-buttons"><div class="segmented" id="pref-repair-percent" role="radiogroup" aria-labelledby="repair-name"></div><input id="pref-repair" class="switch" type="checkbox" role="switch" aria-labelledby="repair-name"></div>
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="delete-name" data-t="deleteOriginals"></b><small data-t="deleteSettingHint"></small></div>
          <input id="pref-delete" class="switch" type="checkbox" role="switch" aria-labelledby="delete-name">
        </div>
        <div class="pref-item sub" id="pref-forgood-row">
          <div class="pref-text"><b id="forgood-name" data-t="deletePermanently"></b><small data-t="deletePermanentlyHint"></small></div>
          <input id="pref-forgood" class="switch" type="checkbox" role="switch" aria-labelledby="forgood-name">
        </div>
        <p class="hint pref-path" id="pref-log"></p>
      </section>
      <!-- the console a .p5z is sent to: its address and the pairing code it shows; the code goes only to
           the engine (in its environment), never into a log or a report -->
      <section class="pref-group">
        <h2 data-t="prefConsole"></h2>
        <div class="pref-item">
          <div class="pref-text"><b id="console-ip-name" data-t="consoleIp"></b><small data-t="consoleIpHint"></small><small class="pref-status warning" id="console-ip-bad" data-t="consoleIpBad" hidden></small></div>
          <input id="pref-console-ip" class="passcode short" type="text" spellcheck="false" autocomplete="off" maxlength="21" placeholder="192.168.1.20" aria-labelledby="console-ip-name">
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="console-code-name" data-t="consoleCode"></b><small data-t="consoleCodeHint"></small><small class="pref-status warning" id="console-code-bad" data-t="consoleCodeBad" hidden></small></div>
          <input id="pref-console-code" class="passcode short" type="password" inputmode="numeric" spellcheck="false" autocomplete="off" maxlength="6" placeholder="000000" aria-labelledby="console-code-name">
        </div>
      </section>
      <!-- the watched folder: off until a folder is chosen and it is turned on; it works while the window is open -->
      <section class="pref-group">
        <h2 data-t="prefWatch"></h2>
        <div class="pref-item">
          <div class="pref-text"><b id="watch-name" data-t="watchOn"></b><small data-t="watchHint"></small><small data-t="watchOriginalsHint"></small><small class="pref-path" id="pref-watch-folder"></small><small class="pref-status warning" id="pref-watch-status" hidden></small></div>
          <div class="pref-buttons"><button id="pref-watch-choose" data-t="choose"></button><input id="pref-watch" class="switch" type="checkbox" role="switch" aria-labelledby="watch-name"></div>
        </div>
        <div class="pref-item sub" id="pref-watch-existing-row" hidden>
          <div class="pref-text"><small data-t="watchExistingHint"></small></div>
          <div class="pref-buttons"><button id="pref-watch-existing"></button></div>
        </div>
        <div class="pref-item sub" id="pref-watch-send-row">
          <div class="pref-text"><b id="watch-send-name" data-t="watchSend"></b><small data-t="watchSendHint"></small></div>
          <input id="pref-watch-send" class="switch" type="checkbox" role="switch" aria-labelledby="watch-send-name">
        </div>
      </section>
      <section class="pref-group">
        <h2 id="names-name" data-t="prefNames"></h2>
        <p class="hint" data-t="namesHint"></p>
        <div class="segmented templates" id="templates" role="radiogroup" aria-labelledby="names-name"></div>
        <label class="template-field"><span data-t="namesCustom"></span><input id="template" type="text" spellcheck="false" autocomplete="off" maxlength="200"></label>
        <p class="hint" data-t="namesFields"></p>
        <p class="warning" id="template-bad" data-t="namesBad" hidden></p>
        <dl class="about-list preview" id="name-preview"><dt data-t="forInstaller"></dt><dd id="preview-p5z"></dd><dt data-t="toOriginal"></dt><dd id="preview-original"></dd><dt data-t="toConsole"></dt><dd id="preview-folder"></dd></dl>
      </section>
      <!-- MaxPack in the Explorer of Windows: only there, each place off until it is turned on -->
      <section class="pref-group" id="pref-explorer" hidden>
        <h2 data-t="prefExplorer"></h2>
        <p class="warning" id="explorer-portable" data-t="explorerPortable" hidden></p>
        <div class="pref-item">
          <div class="pref-text"><b id="menu-name" data-t="explorerMenu"></b><small data-t="explorerMenuHint"></small><small class="pref-status" id="menu-status"></small></div>
          <input id="pref-menu" class="switch" type="checkbox" role="switch" aria-labelledby="menu-name">
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="sendto-name" data-t="explorerSendTo"></b><small data-t="explorerSendToHint"></small><small class="pref-status" id="sendto-status"></small></div>
          <input id="pref-sendto" class="switch" type="checkbox" role="switch" aria-labelledby="sendto-name">
        </div>
        <div class="pref-item">
          <div class="pref-text"><b id="files-name" data-t="explorerFiles"></b><small data-t="explorerFilesHint"></small><small class="pref-status" id="files-status"></small></div>
          <input id="pref-files" class="switch" type="checkbox" role="switch" aria-labelledby="files-name">
        </div>
        <p class="hint" id="explorer-for" data-t="explorerFor"></p>
      </section>
      <section class="pref-group">
        <h2 data-t="prefInternet"></h2>
        <p class="hint plain" data-t="internetText"></p>
      </section>
      <section class="pref-group">
        <h2 data-t="prefAbout"></h2>
        <dl class="about-list"><dt>MaxPack</dt><dd id="about-version"></dd><dt>maxpack-core</dt><dd id="about-core"></dd></dl>
        <div class="pref-item">
          <div class="pref-text"><small data-t="reportHint"></small></div>
          <div class="pref-buttons"><button id="pref-report" data-t="copyReport"></button></div>
        </div>
        <div class="pref-links"><button id="link-bug" class="link" data-t="reportBug"></button><button id="link-game" class="link" data-t="reportGame"></button></div>
        <p class="hint" data-t="legal"></p>
      </section>
    </div>
  </section>
</main>

<!-- a game of the list; app.js fills it, with text only -->
<template id="row-template">
  <tr>
    <td class="name">
      <div class="game">
        <img class="icon" alt="" hidden>
        <span class="cover" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7.5 12h4M9.5 10v4M15 11h.01M17 13h.01"/></svg></span>
        <div class="text">
          <div class="title"></div>
          <div class="file"></div>
          <div class="sizes" hidden></div>
          <div class="where" hidden></div>
          <div class="complete-line" hidden></div>
          <div class="repair-line" hidden></div>
          <div class="list-warn" hidden></div>
          <dl class="facts" hidden></dl>
          <div class="card-actions" hidden><button class="to-verify"></button><button class="to-decompress"></button><button class="to-add-dlc"></button><button class="to-update"></button><button class="to-send"></button></div>
          <div class="note" hidden></div>
          <button class="link report" hidden></button>
          <button class="link compare" hidden></button>
          <button class="link add-dlc" hidden></button>
          <button class="link repair" hidden></button>
          <button class="link grow-anyway" hidden></button>
          <button class="link send-discard" hidden></button>
        </div>
      </div>
    </td>
    <td class="size"></td>
    <td class="state"><span class="badge" hidden></span><div class="segs" hidden></div><div class="step"></div><div class="saved"></div></td>
    <td class="remove"><button class="quiet icon">✕</button></td>
  </tr>
</template>
<!-- a step of the bar of a game: compress, then verify -->
<template id="seg-template"><div class="seg"><div></div></div></template>
<!-- a game of a warning: its name, and what to know of it -->
<template id="line-template"><li><b></b><span></span></li></template>

<!-- the warnings that need a choice, before a queue starts; Escape starts nothing -->
<dialog id="replace-dialog" class="warn-dialog" aria-labelledby="replace-title" aria-describedby="replace-text">
  <h2 id="replace-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="replaceTitle"></span></h2>
  <p class="muted" id="replace-text"></p>
  <ul class="space-list"><li><b id="replace-path"></b><span id="replace-size"></span></li></ul>
  <p class="hint" data-t="replaceHow"></p>
  <label class="check" id="replace-all-row"><input id="replace-all" type="checkbox"><span id="replace-all-text"></span></label>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="skip" data-t="skip" autofocus></button><button value="replace" class="danger" data-t="replace"></button></form>
</dialog>

<dialog id="fat32-dialog" class="warn-dialog" aria-labelledby="fat32-title">
  <h2 id="fat32-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="fat32Title"></span></h2>
  <p class="muted" data-t="fat32Text"></p>
  <ul class="space-list" id="fat32-list"></ul>
  <p class="hint" data-t="fat32Anyway"></p>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="anyway" data-t="fat32Continue"></button><button value="folder" class="primary" data-t="fat32UseFolder" autofocus></button></form>
</dialog>

<dialog id="runtime-dialog" class="warn-dialog" aria-labelledby="runtime-title">
  <h2 id="runtime-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="runtimeAskTitle"></span></h2>
  <p class="muted" data-t="runtimeAskText"></p>
  <ul class="space-list" id="runtime-list"></ul>
  <p class="hint" data-t="runtimeAskWithout"></p>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="without" data-t="runtimeWithout"></button><button value="choose" class="primary" data-t="runtimeChooseFile" autofocus></button></form>
</dialog>

<dialog id="block-dialog" class="warn-dialog" aria-labelledby="block-title">
  <h2 id="block-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="blockTitle"></span></h2>
  <p class="muted" data-t="blockText"></p>
  <ul class="space-list" id="block-list"></ul>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="skip" id="block-skip" data-t="blockSkip"></button><button value="dest" id="block-dest" class="primary" data-t="otherDest" autofocus></button></form>
</dialog>

<dialog id="warn-dialog" class="warn-dialog" aria-labelledby="warn-title">
  <h2 id="warn-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="warnTitle"></span></h2>
  <ul class="space-list" id="warn-list"></ul>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel" autofocus></button><button value="go" class="primary" data-t="startAnyway"></button></form>
</dialog>

<!-- what to add to a .p5z of Details: DLC packages or folders, or the new dump as a folder or as an
     image or package; Escape adds nothing -->
<dialog id="grow-dialog" class="warn-dialog" aria-labelledby="grow-title" aria-describedby="grow-text">
  <h2 id="grow-title"><span id="grow-title-text"></span></h2>
  <p class="muted" id="grow-text"></p>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="files" id="grow-files"></button><button value="folder" id="grow-folder" class="primary" autofocus></button></form>
</dialog>

<!-- the originals that go once checked: what each takes and where it goes; Escape starts nothing -->
<dialog id="delete-dialog" class="warn-dialog" aria-labelledby="delete-title" aria-describedby="delete-text">
  <h2 id="delete-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="deleteTitle"></span></h2>
  <p class="muted" id="delete-text"></p>
  <ul class="space-list" id="delete-list"></ul>
  <label class="check" id="delete-nobin-row"><input id="delete-nobin" type="checkbox"><span id="delete-nobin-text"></span></label>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="keep" data-t="deleteKeep" autofocus></button><button value="delete" class="danger" data-t="deleteGo"></button></form>
</dialog>

<dialog id="space-dialog" class="warn-dialog" aria-labelledby="space-title" aria-describedby="space-text">
  <h2 id="space-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="spaceTitle"></span></h2>
  <p class="muted" id="space-text"></p>
  <ul class="space-list" id="space-list"></ul>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="dest" id="space-dest" data-t="otherDest" autofocus></button><button value="go" id="space-go" class="primary" data-t="startAnyway"></button></form>
</dialog>

<dialog id="leftover-dialog" class="warn-dialog" aria-labelledby="leftover-title" aria-describedby="leftover-text">
  <h2 id="leftover-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="leftoverTitle"></span></h2>
  <p class="muted" id="leftover-text" data-t="leftoverText"></p>
  <ul class="space-list" id="leftover-list"></ul>
  <p class="hint" id="leftover-repair" data-t="leftoverRepairNote" hidden></p>
  <form method="dialog" class="dialog-actions"><button value="later" class="quiet" data-t="leftoverLater"></button><button value="delete" class="primary" data-t="leftoverDelete" autofocus></button></form>
</dialog>

<!-- closing the window while a queue runs: the game at work is cancelled without leaving anything
     half made, or the window stays open; Escape keeps working. A paused queue says it cannot be resumed
     once MaxPack closes -->
<dialog id="close-dialog" class="warn-dialog" aria-labelledby="close-title" aria-describedby="close-text">
  <h2 id="close-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span id="close-title-text" data-t="closeTitle"></span></h2>
  <p class="muted" id="close-text" data-t="closeText"></p>
  <form method="dialog" class="dialog-actions"><button value="close" class="danger" data-t="closeYes"></button><button value="stay" class="primary" data-t="closeNo" autofocus></button></form>
</dialog>

<!-- the end of a queue that wrote games: what it saved, what saved most, and what to do now -->
<dialog id="done-dialog" aria-labelledby="done-title">
  <h2 id="done-title"><span class="squeeze-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><g class="down"><path d="M12 3v6m0 0-3-3m3 3 3-3"/></g><g class="up"><path d="M12 21v-6m0 0-3 3m3-3 3 3"/></g><path d="M5 12h14"/></svg></span><span data-t="doneTitle"></span></h2>
  <!-- what the games made took before and take now: the one squeezed into the other (playDone) -->
  <div class="squeeze" id="done-squeeze" hidden>
    <div class="squeeze-nums" aria-hidden="true"><span id="done-before"></span><span id="done-after"></span></div>
    <div class="squeeze-bar" aria-hidden="true"><span class="free"></span><span class="full"></span></div>
    <div class="squeeze-legend"><span id="done-before-text"></span><span id="done-after-text"></span></div>
  </div>
  <p class="done-saved" id="done-saved"></p>
  <div class="burst" id="done-burst" aria-hidden="true"></div>
  <div class="done-tiles"><div><small data-t="doneTime"></small><b id="done-tile-time"></b></div><div><small data-t="doneGames"></small><b id="done-tile-games"></b></div><div><small data-t="doneSpeed"></small><b id="done-tile-speed"></b></div></div>
  <p class="muted" id="done-stats"></p>
  <p class="done-originals" id="done-originals" hidden></p>
  <p class="done-originals" id="done-repair" hidden></p>
  <div id="done-top-block">
    <h3 data-t="doneTop"></h3>
    <ol class="done-top" id="done-top"></ol>
  </div>
  <div class="done-next" id="done-next-block">
    <h3 data-t="doneNext"></h3>
    <p id="done-next"></p>
  </div>
  <p class="warning" id="done-runtime" hidden></p>
  <form method="dialog" class="dialog-actions"><button type="button" id="done-report" class="quiet" data-t="copyReport"></button><button type="button" id="done-send" data-t="sendCard" hidden></button><button value="close" class="primary" data-t="close" autofocus></button></form>
</dialog>

<!-- Send to the console: the .p5z that go, and the drive of the console with its free space -->
<dialog id="send-dialog" aria-labelledby="send-title" aria-describedby="send-text">
  <h2 id="send-title" data-t="sendTitle"></h2>
  <p class="muted" id="send-text" data-t="sendText"></p>
  <ul class="space-list" id="send-list"></ul>
  <h3 id="send-drive-name" data-t="sendDrive"></h3>
  <p class="muted" id="send-asking" aria-live="polite"></p>
  <div role="radiogroup" aria-labelledby="send-drive-name" id="send-drives"></div>
  <form method="dialog" class="dialog-actions"><button value="cancel" class="quiet" data-t="cancel"></button><button value="send" id="send-go" class="primary" data-t="sendGo" autofocus></button></form>
</dialog>

<!-- Delete what arrived on the console: what a send stopped left there goes, once the user says so -->
<dialog id="discard-dialog" class="warn-dialog" aria-labelledby="discard-title" aria-describedby="discard-text">
  <h2 id="discard-title"><svg class="warn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.5M12 16.8v.2"/></svg><span data-t="discardTitle"></span></h2>
  <p class="muted" id="discard-text"></p>
  <form method="dialog" class="dialog-actions"><button value="keep" class="primary" data-t="discardKeep" autofocus></button><button value="delete" class="danger" data-t="discardGo"></button></form>
</dialog>

<!-- Compare the levels on this PC: the engine packs a sample of the game at each level and tells
     each one as it is measured; a level of the table is chosen with its button. Escape cancels -->
<dialog id="levels-dialog" class="tool-dialog" aria-labelledby="levels-title">
  <h2 id="levels-title" data-t="levelsTitle"></h2>
  <p class="muted" id="levels-game"></p>
  <p class="muted" id="levels-for"></p>
  <div class="bar total" id="levels-bar"><div></div></div>
  <p class="muted" id="levels-status" aria-live="polite"></p>
  <table class="tool-table">
    <thead><tr><th data-t="levelsLevel"></th><th class="num" id="levels-size-head"></th><th class="num" data-t="levelsSaved"></th><th class="num" data-t="levelsTime"></th><th></th></tr></thead>
    <tbody id="levels-rows"></tbody>
  </table>
  <p class="hint" id="levels-image" hidden></p>
  <p class="hint" id="levels-about"></p>
  <form method="dialog" class="dialog-actions"><button type="button" id="levels-cancel" class="quiet" data-t="cancel"></button><button value="close" id="levels-close" class="primary" data-t="close"></button></form>
</dialog>
<template id="level-row-template"><tr><td class="level"></td><td class="num size-cell"></td><td class="num saved-cell"></td><td class="num time-cell"></td><td class="num"><button class="link use"></button></td></tr></template>

<!-- Measure this PC: each count of threads as the engine tries it, the disk of the destination,
     and the threads Compress uses from now on. Escape cancels -->
<dialog id="measure-dialog" class="tool-dialog" aria-labelledby="measure-title">
  <h2 id="measure-title" data-t="measureTitle"></h2>
  <p class="muted" id="measure-intro"></p>
  <div class="bar total" id="measure-bar"><div></div></div>
  <p class="muted" id="measure-status" aria-live="polite"></p>
  <table class="tool-table">
    <thead><tr><th data-t="measureThreads"></th><th data-t="measureSpeed"></th></tr></thead>
    <tbody id="measure-rows"></tbody>
  </table>
  <p class="muted" id="measure-disk"></p>
  <p class="tool-result" id="measure-result" hidden></p>
  <form method="dialog" class="dialog-actions"><button type="button" id="measure-cancel" class="quiet" data-t="cancel"></button><button value="close" id="measure-close" class="primary" data-t="close"></button></form>
</dialog>
<template id="trial-row-template"><tr><td class="threads"></td><td><div class="speed"><span></span><div class="bar"><div></div></div><b class="used"></b></div></td></tr></template>

<div id="drop-overlay" hidden><div class="drop-card"><svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg><b data-t="dropHere"></b></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="i18n/base.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/ru.js"></script>
<script src="i18n/zh.js"></script>
<script src="i18n/de.js"></script>
<script src="i18n/es.js"></script>
<script src="i18n/fr.js"></script>
<script src="i18n/ja.js"></script>
<script src="i18n/pt.js"></script>
<script src="i18n/it.js"></script>
<script src="i18n/ko.js"></script>
<script src="i18n/ar.js"></script>
<script src="app.js"></script>
</body>
</html>
